<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electron Lab — Interactive Review</title><style>body{font-family:Arial,sans-serif;background:#f3f6fa;color:#192538;margin:0}main{max-width:850px;margin:30px auto;background:white;border-radius:16px;padding:30px;box-shadow:0 8px 25px #ccd3dd}h1{margin-top:0}button{cursor:pointer;border:1px solid #bcc8d7;background:#fff;border-radius:9px;padding:12px;margin:5px;font-size:16px}button:hover{background:#e8f1fc}button.selected{background:#cfe4ff;border-color:#2563eb}.primary{background:#194d8c;color:white}.primary:hover{background:#2865ab}#feedback{padding:12px;min-height:24px;font-weight:bold}#progress{color:#59677a}#visual{margin:16px 0}svg{max-width:100%}.dot{font-size:25px}.dotbtn{width:66px;height:66px;font-size:25px}.dotbtn.active{background:#cfe4ff}.hide{display:none}input{font-size:17px;padding:10px;width:180px}small{color:#536174}#choices{display:flex;flex-wrap:wrap;gap:6px}#choices button{flex:1 1 180px}#nav{margin-top:20px}#score{font-weight:bold} .pill{display:inline-block;background:#e8eef7;border-radius:20px;padding:6px 12px;margin-bottom:12px}</style></head><body><main><h1>Electron Lab: Interactive Study Cards</h1><p>Work through 24 cards. Get immediate feedback, retry mistakes, and build Lewis structures by clicking electron positions.</p><div id="progress"></div><div id="card"><div class="pill" id="topic"></div><h2 id="question"></h2><div id="visual"></div><div id="choices"></div><div id="special"></div><div id="feedback" aria-live="polite"></div><div id="nav"><button id="check" class="primary" onclick="check()">Check answer</button><button id="next" class="primary hide" onclick="next()">Next card →</button></div></div><div id="finish" class="hide"></div></main><script>
const q=[
['Electrons & Energy','Which statement best describes electrons?', ['They only behave like solid particles','They show both particle and wave behavior','They are located inside the nucleus','They have a positive charge'],1,'Electrons have wave-particle behavior.'],
['Electrons & Energy','An electron absorbs energy. What can happen?', ['It moves to a higher energy level','It becomes a proton','It releases light immediately as it rises','It loses its negative charge'],0,'Absorbing energy can excite an electron to a higher level.'],
['Electrons & Energy','An excited electron drops to a lower energy level. What happens?', ['It absorbs a neutron','It emits energy as light','Its nucleus disappears','It becomes a different element'],1,'The energy difference is emitted as electromagnetic radiation.'],
['Electrons & Energy','Which state has the lower energy?', ['Excited state','Ground state','Both always have equal energy','Neither'],1,'The ground state is the lowest available energy state.'],
['Electrons & Energy','What is an emission spectrum?', ['All protons in an atom','The light released from excited atoms of an element','A chart of atomic masses','The number of valence electrons'],1,'Emission spectra result from electrons releasing specific amounts of energy.'],
['Electrons & Energy','According to the Heisenberg uncertainty principle, which pair cannot both be determined exactly at the same time?', ['Mass and charge','Position and momentum','Protons and neutrons','Wavelength and color'],1,'Position and momentum cannot both be precisely known.'],
['Electromagnetic Spectrum','Which order goes from longest to shortest wavelength?', ['Gamma, X-ray, UV, visible, IR, microwave, radio','Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma','Radio, infrared, microwave, visible, X-ray, UV, gamma','Visible, radio, gamma, microwave, infrared, UV, X-ray'],1,'The electromagnetic spectrum runs radio → microwave → infrared → visible → ultraviolet → X-ray → gamma.'],
['Electromagnetic Spectrum','Which has the highest frequency?', ['Radio waves','Microwaves','X-rays','Infrared'],2,'X-rays have higher frequency than the other options.'],
['Electromagnetic Spectrum','If wavelength decreases, frequency…', ['Decreases','Increases','Stays constant','Becomes zero'],1,'Wavelength and frequency are inversely related.'],
['Electromagnetic Spectrum','Which carries more energy?', ['Red visible light','Violet visible light','Both always equal','Neither carries energy'],1,'Violet light has a higher frequency and more energy than red light.'],
['Electromagnetic Spectrum','Which has the longer wavelength?', ['Ultraviolet','Infrared','Both equal','Cannot be determined'],1,'Infrared is on the longer-wavelength side of visible light.'],
['Electromagnetic Spectrum','Two waves travel in a vacuum. Wave A has 3 crests in the same distance where wave B has 6. Which has higher frequency?', ['Wave A','Wave B','Both equal','Not enough information'],1,'More cycles over the same distance means shorter wavelength and higher frequency.'],
['Waves & Calculations','Which equation connects light speed, wavelength, and frequency?', ['c = λν','c = λ/ν','c = λ + ν','c = ν − λ'],0,'Speed of light = wavelength × frequency.'],
['Waves & Calculations','Light has wavelength 2.0 × 10⁻⁷ m. Find its frequency. Use c = 3.0 × 10⁸ m/s.',null,'1.5e15','Divide c by wavelength: 3.0 × 10⁸ / 2.0 × 10⁻⁷ = 1.5 × 10¹⁵ Hz.','number'],
['Waves & Calculations','Light has frequency 6.0 × 10¹⁴ Hz. Find wavelength in meters.',null,'5e-7','Divide c by frequency: 3.0 × 10⁸ / 6.0 × 10¹⁴ = 5 × 10⁻⁷ m.','number'],
['Waves & Calculations','Which is the correct wavelength conversion?', ['500 nm = 500 m','500 nm = 5.0 × 10⁻⁷ m','500 nm = 5.0 × 10⁻³ m','500 nm = 5.0 × 10⁷ m'],1,'One nanometer is 10⁻⁹ meters.'],
['Stability & Ions','Why are noble gases generally unreactive?', ['They have no electrons','Their outer energy levels are full','They all have eight protons','They are all metals'],1,'A full outer shell makes noble gases especially stable. Helium has a full shell with two electrons.'],
['Stability & Ions','A neutral magnesium atom loses two electrons. What ion forms?', ['Mg²⁻','Mg²⁺','Mg⁺','Mg⁻'],1,'Losing two negative electrons gives magnesium a +2 charge.'],
['Stability & Ions','An oxygen atom gains two electrons. What ion forms?', ['O²⁺','O⁺','O²⁻','O⁻'],2,'Gaining two electrons gives oxygen a −2 charge.'],
['Stability & Ions','Which statement is correct?', ['Cations gain electrons and are negative','Anions lose electrons and are positive','Cations lose electrons and are positive','All ions have zero charge'],2,'Cations lose electrons; anions gain electrons.'],
['Lewis Dot Structures','Build the Lewis dot structure for carbon (C). Click positions to place its valence electrons.',null,[1,1,1,1],'Carbon has four valence electrons, placed one on each side before pairing.','lewis','C'],
['Lewis Dot Structures','Build the Lewis dot structure for nitrogen (N).',null,[2,1,1,1],'Nitrogen has five valence electrons: one pair and three single dots.','lewis','N'],
['Lewis Dot Structures','Build the Lewis dot structure for fluorine (F).',null,[2,2,2,1],'Fluorine has seven valence electrons: three pairs and one single dot.','lewis','F'],
['Lewis Dot Structures','Build the Lewis dot structure for phosphorus (P).',null,[2,1,1,1],'Phosphorus has five valence electrons.','lewis','P']
];let index=0,chosen=null,passed=Array(q.length).fill(false),dots=[0,0,0,0];const $=id=>document.getElementById(id);function render(){let a=q[index];chosen=null;dots=[0,0,0,0];$('progress').textContent=`Card ${index+1} of ${q.length} • ${passed.filter(Boolean).length} correct on first try`; $('topic').textContent=a[0];$('question').textContent=a[1];$('feedback').textContent='';$('choices').innerHTML='';$('special').innerHTML='';$('next').classList.add('hide');$('check').classList.remove('hide');if(a[5]==='lewis'){drawLewis(a[6]);}else if(a[5]==='number'){$('special').innerHTML='<label>Answer in scientific notation (e.g. 1.5e15): <input id="numeric" type="text"></label>';}else a[2].forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{chosen=i;[...$('choices').children].forEach((x,j)=>x.classList.toggle('selected',j===i))};$('choices').appendChild(b)});}function drawLewis(symbol){$('special').innerHTML=`<p>Click a side to add 1 or 2 electrons. Click again to cycle 0 → 1 → 2 → 0.</p><div style="display:grid;grid-template-columns:90px 90px 90px;grid-template-rows:75px 75px 75px;align-items:center;justify-content:center;text-align:center"><span></span><button class="dotbtn" id="d0" onclick="dot(0)"></button><span></span><button class="dotbtn" id="d3" onclick="dot(3)"></button><strong style="font-size:36px">${symbol}</strong><button class="dotbtn" id="d1" onclick="dot(1)"></button><span></span><button class="dotbtn" id="d2" onclick="dot(2)"></button><span></span></div><small>Any rotation of a correct Lewis dot diagram is accepted.</small>`;updateDots()}function dot(i){dots[i]=(dots[i]+1)%3;updateDots()}function updateDots(){[0,1,2,3].forEach(i=>{$('d'+i).textContent='•'.repeat(dots[i])||'+';$('d'+i).classList.toggle('active',dots[i]>0)})}function check(){let a=q[index],ok=false;if(a[5]==='lewis'){ok=dots.slice().sort().join()===a[3].slice().sort().join()}else if(a[5]==='number'){let raw=$('numeric').value.trim().replace(/×10\^?/,'e').replace(/\s/g,'');let n=Number(raw);ok=raw!==''&&Number.isFinite(n)&&Math.abs(n-Number(a[3]))/Number(a[3])<0.02}else ok=chosen===a[3];if(ok){if(!$('feedback').dataset.tried)passed[index]=true;$('feedback').textContent='✓ Correct! '+a[4];$('feedback').style.color='#12643b';$('check').classList.add('hide');$('next').classList.remove('hide')}else{$('feedback').textContent='Not quite. Try again! Hint: '+(a[5]==='lewis'?'Use the group number to count valence electrons.':a[0]==='Waves & Calculations'?'Rearrange c = λν and check units.':a[0]==='Stability & Ions'?'Think about whether electrons were gained or lost.':a[0]==='Electromagnetic Spectrum'?'Remember: shorter wavelength means higher frequency and energy.':'Think about absorbing versus emitting energy.');$('feedback').style.color='#a23a18';$('feedback').dataset.tried='1'}}function next(){delete $('feedback').dataset.tried;index++;if(index<q.length)render();else{let score=passed.filter(Boolean).length;$('card').classList.add('hide');$('progress').textContent='Review complete';$('finish').classList.remove('hide');$('finish').innerHTML=`<h2>Finished!</h2><p id="score">${score} of ${q.length} correct on the first attempt</p><p>You practiced all 5 topics. Revisit the cards to improve your score.</p><button class="primary" onclick="location.reload()">Start over</button>`}}render();</script></body></html>
